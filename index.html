<script>
(() => {
  'use strict';
  const svg = document.getElementById('scene');
  const $ = id => document.getElementById(id);
  const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
  const ease = t => { t=clamp(t); return t*t*(3-2*t); };
  const lerp = (a,b,t) => a+(b-a)*t;
  const TOTAL = 52;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const paths = {};
  ['users-app','direct-forward','direct-return','app-redis','redis-db','db-redis','redis-app'].forEach(id => paths[id] = $(id));
  const packets = ['packet-user','packet-main','packet-cache','packet-return','packet-write'].map($);
  const dbBars = [...document.querySelectorAll('.dbbar')];
  const hitBars = [...document.querySelectorAll('.hitbar')];
  let paused = reduced, elapsed = 0, last = 0;

  const opacity = (id,v) => $(id).setAttribute('opacity',String(clamp(v)));
  const setText = (id,value) => { if($(id).textContent !== String(value)) $(id).textContent = String(value); };
  const setStyle = (id,attr,value) => $(id).setAttribute(attr,String(value));
  const along = (id,packet,progress,visible=true,reverse=false) => {
    const p = paths[id];
    const len = p.getTotalLength();
    const q = clamp(reverse ? 1-progress : progress) * len;
    const pt = p.getPointAtLength(q);
    setStyle(packet,'cx',pt.x); setStyle(packet,'cy',pt.y); opacity(packet,visible?1:0);
  };
  const hidePackets = () => packets.forEach(p => opacity(p.id,0));
  const routeStyle = (id,stroke,op,marker,width=2.2) => {
    const p = paths[id]; p.setAttribute('stroke',stroke); p.setAttribute('opacity',op); p.setAttribute('stroke-width',width); p.setAttribute('marker-end',`url(#${marker})`);
  };
  const setChapter = (label,color='#ffad66',bg='#211912',stroke='#8e5a32') => {
    setText('chapter-chip-text',label);
    $('chapter-chip').querySelector('rect').setAttribute('fill',bg);
    $('chapter-chip').querySelector('rect').setAttribute('stroke',stroke);
    $('chapter-chip-text').setAttribute('fill',color);
  };
  const setStory = (kicker,title,copy,color='#ffad66') => {
    setText('story-kicker',kicker); setText('story-title',title); setText('story-copy',copy);
    $('story-kicker').setAttribute('fill',color);
  };
  const dbReadCount = n => {
    setText('db-count',n);
    dbBars.forEach((b,i)=>b.setAttribute('opacity',i<Math.min(6,n) ? .95 : .14));
  };
  const cacheHitCount = n => {
    setText('hit-count',n);
    hitBars.forEach((b,i)=>b.setAttribute('opacity',i<Math.min(6,n) ? .95 : .14));
  };
  const appStatus = (label,kind) => {
    setText('app-status',label);
    const bg = kind==='hit'?'#10291f':kind==='miss'?'#2a2115':'#211912';
    const st = kind==='hit'?'#3d9e79':kind==='miss'?'#a8783b':'#8e5a32';
    const fg = kind==='hit'?'#8ceac1':kind==='miss'?'#ffc27e':'#ffad66';
    setStyle('app-status-bg','fill',bg); setStyle('app-status-bg','stroke',st); setStyle('app-status','fill',fg);
  };
  const redisStatus = (label,kind) => {
    setText('redis-status',label);
    const bg = kind==='hit'?'#123326':kind==='miss'?'#2c2215':'#14251f';
    const st = kind==='hit'?'#50dfa2':kind==='miss'?'#ad8046':'#3d9e79';
    const fg = kind==='miss'?'#ffc27e':'#8ceac1';
    setStyle('redis-status-bg','fill',bg); setStyle('redis-status-bg','stroke',st); setStyle('redis-status','fill',fg);
  };
  const cacheFill = v => { opacity('cache-filled',v); opacity('cache-empty',1-v); };
  const setRedis = (v) => { opacity('redis-node',v); opacity('cache-route-label',v); opacity('db-route-label',v); };
  const setProgress = t => {
    setStyle('timeline-fill','width',285*clamp(t/TOTAL));
    const s=Math.floor(t),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');
    setText('time-readout',`${m}:${ss} / 00:52`);
  };

  function draw(t) {
    hidePackets();
    const before = t < 12;
    const setup = t >= 12 && t < 16;
    const miss = t >= 16 && t < 26;
    const hits = t >= 26 && t < 39;
    const invalidate = t >= 39 && t < 47;
    const recap = t >= 47;
    setProgress(t);

    // The architecture transforms from direct database reads to cache-aside.
    setRedis(ease((t-12)/2.4));
    const redisVisible = t >= 12;
    opacity('direct-label', before ? 1 : 0);
    const directOpacity = before ? 1 : invalidate ? .82 : setup ? 1-ease((t-12)/3) : 0.12;
    const directColor = before ? '#ffad66' : invalidate ? '#b4a0ff' : '#596875';
    const directMarker = before ? 'arrow-orange' : invalidate ? 'arrow-violet' : 'arrow-muted';
    routeStyle('direct-forward',directColor,directOpacity,directMarker,before?2.8:invalidate?2.4:1.5);
    routeStyle('direct-return',directColor,directOpacity*.82,directMarker,before?2.3:invalidate?2:1.4);
    routeStyle('users-app','#35d5f4',.8,'arrow-cyan',2);
    routeStyle('app-redis','#50dfa2',redisVisible?1:0,'arrow-green',2.4);
    routeStyle('redis-db','#ffad66',redisVisible?((miss||invalidate)?1:.22):0,'arrow-orange',2.1);
    routeStyle('db-redis','#ffad66',redisVisible?((miss||invalidate)?1:.16):0,'arrow-orange',1.9);
    routeStyle('redis-app','#50dfa2',redisVisible?1:0,'arrow-green',2.3);

    let dbReads=0, hitsCount=0;
    if(before) {
      const local=t;
      dbReads=Math.min(6,Math.floor(local/1.8)+1);
      setChapter('NO CACHE');
      setStory('CHAPTER 01  /  BEFORE REDIS','Every request takes the long road.','The app asks the primary database for the same popular product again — and again.');
      appStatus('NO CACHE','none');
      setText('path-state','APPLICATION → DATABASE');
      opacity('redis-node',0); opacity('cache-route-label',0); opacity('db-route-label',0);
      // Repeating request/response journeys; each reaches the primary DB.
      for(let i=0;i<6;i++) {
        const start=.28+i*1.8, d=t-start;
        if(d>=0&&d<.42) along('users-app','packet-user',d/.42,true);
        else if(d>=.42&&d<1.55) along('direct-forward','packet-main',(d-.42)/1.13,true);
        else if(d>=1.55&&d<2.25) along('direct-return','packet-return',(d-1.55)/.7,true);
        else if(d>=2.25&&d<2.6) along('users-app','packet-user',(d-2.25)/.35,true,true);
      }
      $('db-node').querySelector('rect').setAttribute('stroke',dbReads>=4?'#ff7078':'#9a714b');
      $('db-node').querySelector('rect').setAttribute('stroke-width',dbReads>=4?2.3:1.3);
    } else {
      $('db-node').querySelector('rect').setAttribute('stroke','#9a714b');
      $('db-node').querySelector('rect').setAttribute('stroke-width','1.3');
      if(setup) {
        dbReads=0;
        setChapter('ADDING REDIS','#8ceac1','#10251d','#3d9e79');
        setStory('CHAPTER 02  /  ADD A MEMORY LAYER','Put Redis between the app and the database.','Redis starts empty. The first request will still need the primary database.','#8ceac1');
        appStatus('CHECK REDIS','hit'); redisStatus('CACHE EMPTY','empty');
        setText('path-state','APPLICATION → REDIS');
        opacity('redis-node',ease((t-12)/2));
      } else if(miss) {
        const u=t-16;
        dbReads=1;
        setChapter(u<4?'CACHE MISS':'CACHE FILLED',u<4?'#ffc27e':'#8ceac1',u<4?'#2a2115':'#10251d',u<4?'#a8783b':'#3d9e79');
        setStory('CHAPTER 03  /  THE FIRST REQUEST','A miss sends one request to the database.','Redis has no copy yet: GET → MISS → read the primary → SET the value → return it.','#ffc27e');
        setText('path-state','MISS → DATABASE → REDIS');
        if(u<1.4) { appStatus('GET product:42','none'); redisStatus('CACHE EMPTY','empty'); }
        else if(u<3.2) { appStatus('CACHE MISS','miss'); redisStatus('MISS','miss'); }
        else if(u<6.0) { appStatus('LOAD FROM DB','miss'); redisStatus('FETCHING VALUE','miss'); }
        else { appStatus('VALUE RETURNED','hit'); redisStatus('KEY STORED · TTL 60s','hit'); }
        const fill=ease((u-6.0)/.9); cacheFill(fill);
        if(u<.45) along('users-app','packet-user',u/.45,true);
        else if(u<1.8) along('app-redis','packet-cache',(u-.45)/1.35,true);
        else if(u<2.4) { opacity('packet-cache',0); }
        else if(u<4.0) along('redis-db','packet-main',(u-2.4)/1.6,true);
        else if(u<5.4) along('db-redis','packet-main',(u-4.0)/1.4,true);
        else if(u<6.8) { cacheFill(ease((u-5.4)/1.0)); along('redis-app','packet-return',(u-5.4)/1.4,true); }
        else { cacheFill(1); }
        opacity('redis-node',1);
      } else if(hits) {
        const u=t-26;
        dbReads=1;
        hitsCount=Math.min(6,Math.floor(u/1.65)+1);
        setChapter('CACHE HIT','#8ceac1','#10251d','#3d9e79');
        setStory('CHAPTER 04  /  REPEAT VISITS','Now Redis answers from memory.','The same product is already cached. The app gets it from Redis, so the primary database is skipped.','#8ceac1');
        appStatus('CACHE HIT','hit'); redisStatus('HIT · IN RAM','hit'); cacheFill(1);
        setText('path-state','APPLICATION → REDIS');
        for(let i=0;i<7;i++) {
          const start=.22+i*1.65, d=u-start;
          if(d>=0&&d<.28) along('users-app','packet-user',d/.28,true);
          else if(d>=.28&&d<.72) along('app-redis','packet-cache',(d-.28)/.44,true);
          else if(d>=.72&&d<1.16) along('redis-app','packet-return',(d-.72)/.44,true);
          else if(d>=1.16&&d<1.42) along('users-app','packet-user',(d-1.16)/.26,true,true);
        }
      } else if(invalidate) {
        const u=t-39;
        dbReads=2; hitsCount=7;
        setChapter(u<3?'DATA UPDATED':'CACHE REFRESH','#b4a0ff','#1d1930','#7566ae');
        setStory('CHAPTER 05  /  KEEP THE CACHE FRESH','When data changes, invalidate the old copy.','Update the primary database, delete the cached key, then let the next read load the fresh value.','#b4a0ff');
        cacheFill(1-ease((u-2.0)/.7));
        setText('db-price','$95.00');
        setText('cache-price','$89.00  ·  TTL 60s');
        setText('path-state','UPDATE DB → DEL CACHE');
        appStatus(u<2?'WRITE PRODUCT':'DEL product:42','none');
        redisStatus(u<2?'KEY STILL CACHED':u<3?'KEY DELETED':'RELOAD ON NEXT READ','miss');
        if(u<1.6) along('direct-forward','packet-write',ease(u/1.6),true);
        else if(u>=2&&u<2.9) along('app-redis','packet-write',ease((u-2)/.9),true);
        else if(u>=3.0&&u<4.0) { cacheFill(0); }
        else if(u>=4.1&&u<5.2) { along('app-redis','packet-cache',ease((u-4.1)/1.1),true); redisStatus('MISS','miss'); }
        else if(u>=5.2&&u<6.3) { along('redis-db','packet-main',ease((u-5.2)/1.1),true); }
        else if(u>=6.3&&u<7.0) { along('db-redis','packet-main',ease((u-6.3)/.7),true); }
        else if(u>=7.0&&u<7.8) { cacheFill(ease((u-7.0)/.8)); along('redis-app','packet-return',ease((u-7.0)/.8),true); setText('cache-price','$95.00  ·  TTL 60s'); redisStatus('FRESH VALUE STORED','hit'); appStatus('CACHE REFILLED','hit'); }
        else if(u>=7.8) { cacheFill(1); setText('cache-price','$95.00  ·  TTL 60s'); redisStatus('FRESH VALUE STORED','hit'); appStatus('CACHE REFILLED','hit'); }
      } else {
        dbReads=2; hitsCount=7;
        setChapter('THE PAYOFF','#8ceac1','#10251d','#3d9e79');
        setStory('CHAPTER 06  /  THE PAYOFF','Same app. Same product. Fewer database trips.','Redis serves repeated reads from memory. Your primary database remains the source of truth.','#8ceac1');
        appStatus('CACHE HIT','hit'); redisStatus('HIT · IN RAM','hit'); cacheFill(1);
        setText('path-state','APPLICATION → REDIS');
      }
    }
    dbReadCount(dbReads); cacheHitCount(hitsCount);
    if(t>=26) opacity('direct-label',0);
  }

  function frame(now) {
    if(!last) last=now;
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(!paused) {
      elapsed += dt;
      if(elapsed >= TOTAL) elapsed=0;
    }
    draw(paused && reduced ? TOTAL-0.1 : elapsed);
    requestAnimationFrame(frame);
  }
  svg.addEventListener('click',()=>{
    paused=!paused;
    setText('pause-label',paused?'CLICK TO RESUME':'CLICK TO PAUSE');
    last=0;
  });
  window.addEventListener('keydown',e=>{
    if(e.code==='Space' && !e.repeat) { e.preventDefault(); paused=!paused; setText('pause-label',paused?'CLICK TO RESUME':'CLICK TO PAUSE'); last=0; }
  });
  if(reduced) { elapsed=TOTAL-0.1; paused=true; }
  draw(elapsed);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
